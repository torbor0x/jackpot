name: JackpotEx Cron

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Trigger mode: claim or draw"
        required: true
        default: "claim"
        type: choice
        options:
          - claim
          - draw

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoints
        env:
          BASE_URL: ${{ secrets.JACKPOTEX_BASE_URL }}
          CRON_SECRET: ${{ secrets.JACKPOTEX_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing JACKPOTEX_BASE_URL or JACKPOTEX_CRON_SECRET secrets."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "draw" ]; then
              curl -fsS "${BASE_URL}/api/cron-draw?secret=${CRON_SECRET}"
            else
              curl -fsS "${BASE_URL}/api/cron-claim?secret=${CRON_SECRET}"
            fi
            exit 0
          fi

          minute=$(date -u +%M)
          if [ "$minute" = "00" ]; then
            curl -fsS "${BASE_URL}/api/cron-draw?secret=${CRON_SECRET}"
          else
            curl -fsS "${BASE_URL}/api/cron-claim?secret=${CRON_SECRET}"
          fi
